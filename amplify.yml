version: 1
env:
  variables:
    REGION: $REGION
    ACCESS_KEY_ID: $ACCESS_KEY_ID
    SECRET_ACCESS_KEY: $SECRET_ACCESS_KEY
    DYNAMODB_TABLE_NAME: $DYNAMODB_TABLE_NAME
    S3_BUCKET_NAME: $S3_BUCKET_NAME
    ACCESS_KEY: $ACCESS_KEY
frontend:
    phases:
        preBuild:
            commands:
                - 'npm ci --legacy-peer-deps'
        build:
            commands:
                - 'npm run build'
    artifacts:
        baseDirectory: .next
        files:
            - '**/*'
    cache:
        paths:
            - '.next/cache/**/*'
            - 'node_modules/**/*'
